<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Unfurl card source. Screenshot at 1200x630 to og.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Oswald:wght@600&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{--ink:#0C0C0C;--cement:#9B9B95;--cream:#F3EFE4;--yellow:#F6C500;--orange:#F0611F;--royal:#1E4FD6;--olive:#5F6B3C}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--ink);color:var(--cream)}
.bar{display:flex;justify-content:space-between;padding:22px 56px;font-family:"Roboto Mono",monospace;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.bar b{color:var(--yellow)}
.hz{height:26px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 22px,var(--ink) 22px 44px)}
.main{padding:40px 56px 0;display:grid;grid-template-columns:1fr 250px;gap:30px;align-items:end}
.tag{display:inline-block;background:var(--yellow);color:var(--ink);font-family:"Roboto Mono",monospace;font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;margin-bottom:18px}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:132px;line-height:.86;margin:0}
h1 span{color:var(--yellow)}
.sub{font-family:"Roboto Mono",monospace;font-size:21px;line-height:1.45;margin-top:22px;color:#E8E3D6;max-width:760px}
.lines{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:6px}
.rd{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:"Archivo Black",sans-serif;font-size:58px;line-height:1}
.foot{position:absolute;left:0;right:0;bottom:0}
.foot .in{display:flex;justify-content:space-between;padding:14px 56px 16px;font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.foot .in span:last-child{color:var(--cement);font-family:"Roboto Mono",monospace;font-weight:500;font-size:17px;letter-spacing:.06em;text-transform:none}
</style></head><body>
<div class="bar"><span><b>Service advisory</b> · Platform's Edge</span><span>Manhattan · Brooklyn</span></div>
<div class="hz"></div>
<div class="main">
  <div>
    <div class="tag">Planned work</div>
    <h1>Keeping the<br>lights <span>on</span></h1>
    <div class="sub">Dark storefronts, markets and the express route to a pop-up by November 20.</div>
  </div>
  <div class="lines">
    <div class="rd" style="background:var(--orange);color:var(--ink)">X</div>
    <div class="rd" style="background:var(--yellow);color:var(--ink)">P</div>
    <div class="rd" style="background:var(--royal)">F</div>
    <div class="rd" style="background:var(--olive)">M</div>
  </div>
</div>
<div class="foot"><div class="in"><span>PJ O'Rourke II</span><span>feldtdesign-ship-it.github.io/occupancy-product</span></div></div>
</body></html>
